<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lending Copilot</title>
<style>
  :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --text: #e2e8f0; --muted: #94a3b8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; }
  header .badge { font-size: 11px; background: #0ea5e9; color: #fff; padding: 2px 8px; border-radius: 10px; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 860px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #0369a1; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid #334155; }
  .cites { margin-top: 10px; font-size: 12px; color: var(--muted); border-top: 1px solid #334155; padding-top: 8px; }
  .cites .cite { display: block; margin-top: 4px; }
  .cites .src { color: var(--accent); cursor: pointer; }
  .chunk-text { display: none; margin-top: 4px; padding: 8px; background: #0f172a; border-radius: 6px; color: var(--text); }
  #composer { padding: 14px 20px; background: var(--panel); border-top: 1px solid #334155; display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  #q { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 14px; }
  button { padding: 12px 20px; border: none; border-radius: 8px; background: var(--accent); color: #04222e; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; padding: 6px; }
</style>
</head>
<body>
<header>
  <h1>Lending Copilot</h1><span class="badge">RAG demo</span>
  <span id="status">connecting…</span>
</header>
<div id="chat"></div>
<div class="hint">Try: “What is the minimum CIBIL score for a personal loan?” or “When do field visits start?”</div>
<div id="composer">
  <input id="q" type="text" placeholder="Ask about lending / credit policy…" autocomplete="off">
  <button id="send">Ask</button>
</div>
<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');

fetch('/health').then(r => r.json()).then(h => {
  statusEl.textContent = `${h.docs_indexed} docs · ${h.chunks_indexed} chunks · ${h.llm_model}`;
}).catch(() => statusEl.textContent = 'offline');

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function addAnswer(data) {
  const d = document.createElement('div');
  d.className = 'msg bot';
  const body = document.createElement('div');
  body.textContent = data.answer;
  d.appendChild(body);
  if (data.citations && data.citations.length) {
    const cites = document.createElement('div');
    cites.className = 'cites';
    cites.textContent = 'Sources:';
    const byChunk = {};
    (data.chunks || []).forEach(c => { byChunk[c.citation.doc_id + ':' + c.citation.chunk_index] = c.text; });
    data.citations.forEach((c, i) => {
      const line = document.createElement('span');
      line.className = 'cite';
      const link = document.createElement('span');
      link.className = 'src';
      link.textContent = `[${i + 1}] ${c.title} (chunk ${c.chunk_index}, score ${c.score})`;
      const txt = document.createElement('div');
      txt.className = 'chunk-text';
      txt.textContent = byChunk[c.doc_id + ':' + c.chunk_index] || '';
      link.onclick = () => txt.style.display = txt.style.display === 'block' ? 'none' : 'block';
      line.appendChild(link); line.appendChild(txt);
      cites.appendChild(line);
    });
    d.appendChild(cites);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function ask() {
  const question = q.value.trim();
  if (!question) return;
  addMsg(question, 'user');
  q.value = '';
  sendBtn.disabled = true;
  const thinking = addMsg('Thinking…', 'bot');
  try {
    const r = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    const data = await r.json();
    thinking.remove();
    addAnswer(data);
  } catch (e) {
    thinking.textContent = 'Error: could not reach the API.';
  }
  sendBtn.disabled = false;
}

sendBtn.onclick = ask;
q.onkeydown = e => { if (e.key === 'Enter') ask(); };
</script>
</body>
</html>
